# Prometheus configuration for VM2

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Monitor Prometheus itself on VM2
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Monitor VM1 - Node Exporter
  - job_name: "vm1-node"
    scrape_interval: 5s
    scrape_timeout: 5s
    static_configs:
      - targets: ["192.168.100.10:9100"]

  # Monitor VM1 - Process Exporter
  - job_name: "vm1-process"
    scrape_interval: 5s
    scrape_timeout: 5s
    static_configs:
      - targets: ["192.168.100.10:9256"]
