# Site phục vụ tệp benchmark. Được script scripts/server/setup-server.sh cài vào
# /etc/nginx/sites-available/benchmark và bật qua sites-enabled. Site mặc định bị gỡ.
#
# Mục đích: trả đúng HTTP 200 và đủ 65.536 byte cho GET /benchmark/payload.bin,
# không redirect, không nén, để số liệu k6 phản ánh khả năng phục vụ của máy chủ.

server {
    listen 80 default_server;
    server_name _;

    root /var/www;

    location = /benchmark/payload.bin {
        default_type application/octet-stream;
        gzip off;
    }
}
